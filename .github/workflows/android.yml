name: Android quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.READMD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/readmd-release.jks"
      - name: Verify tests, lint, and build outputs
        env:
          READMD_SIGNING_STORE_FILE: ${{ runner.temp }}/readmd-release.jks
          READMD_SIGNING_STORE_PASSWORD: ${{ secrets.READMD_RELEASE_STORE_PASSWORD }}
          READMD_SIGNING_KEY_ALIAS: ${{ secrets.READMD_RELEASE_KEY_ALIAS }}
          READMD_SIGNING_KEY_PASSWORD: ${{ secrets.READMD_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            --stacktrace
      - name: Verify signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: readmd-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: readmd-release-apk
          path: release
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ReadMD $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            release/app-release.apk
